name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del núcleo de procesado
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk nitida.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nitida-debug-apk
          path: nitida.apk

      # Cada push a main publica una versión con el APK descargable directamente:
      # https://github.com/<usuario>/<repo>/releases/latest/download/nitida.apk
      - name: Publicar versión con el APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" nitida.apk \
            --title "Nítida (compilación ${{ github.run_number }})" \
            --notes "APK de prueba compilado automáticamente desde ${{ github.sha }}. Para instalarlo, permite instalar apps de origen desconocido." \
            --latest
